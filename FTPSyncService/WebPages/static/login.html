<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FTPSync Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: var(--card);
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      width: 320px;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--accent);
    }

    .login-box label {
      display: block;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #ccc;
    }

    .login-box input {
      width: 100%;
      padding: 8px 10px;
      margin-top: 0.3rem;
      background: #111;
      border: 1px solid #444;
      color: #eee;
      border-radius: 5px;
    }

    .login-box button {
      margin-top: 1.5rem;
      width: 100%;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .login-box button:hover {
      opacity: 0.9;
    }

    footer {
      text-align: center;
      color: #555;
      padding: 10px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h2>FTPSync Login</h2>
      <form id="loginForm">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <button type="submit">Log In</button>
      </form>
    </div>
  </div>

  <footer>
    &copy; 2025 FTPSync Tool
  </footer>

  <script src="loginManager.js"></script>
    <script>
    // if we’re already logged in, go straight to the main page
    if (loginManager.getToken()) {
        window.location.href = "/static/index.html";
    }

    document.querySelector("#loginForm").addEventListener("submit", async e => {
        e.preventDefault();
        const u = document.querySelector("#username").value.trim();
        const p = document.querySelector("#password").value;
        await loginManager.login(u, p);
    });
    </script>

</body>
</html>
